name: Release Android APK

# Push a tag like v1.1.0 (matching "version" in app.json) to build a signed APK and publish it
# as a GitHub Release. Installed copies of the app see the new release and offer the download.
#
# Run it by hand (tools/release.ps1 does) to pick the build:
#   variant=release  shows "1.1.0", published as the latest release (everyone gets it).
#   variant=beta     shows "1.1.0:b3" (the beta number is "extra.beta" in app.json), published as a
#                    pre-release tagged v1.1.0-b3. Only beta builds look at pre-releases, so it reaches
#                    the developer's own devices and nobody else's.
on:
  push:
    # Release tags only: beta tags (v1.1.0-b3) come from a run that already built them.
    tags: ['v*', '!v*-b*']
  workflow_dispatch:
    inputs:
      variant:
        description: Which build
        type: choice
        options: [release, beta]
        default: release

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # app.config.js reads this: the version shown, the versionCode, and which updates the build takes.
      BLOOM_VARIANT: ${{ inputs.variant || 'release' }}
    steps:
      - name: Check the signing key is configured
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are not set, so this builds an UNSIGNED APK as a workflow artifact. Sign it locally with the release key (see README), or add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to publish releases automatically."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches app.json
        if: startsWith(github.ref, 'refs/tags/') && env.BLOOM_VARIANT == 'release'
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app.json version $APP_VERSION" >&2
            exit 1
          fi

      - name: Typecheck, lint and test
        run: |
          npx tsc --noEmit
          npx eslint src
          npx jest --ci

      - name: Restore the signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Generate the native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build the release APK
        working-directory: android
        env:
          NODE_ENV: production
          BLOOM_UPLOAD_STORE_FILE: ${{ runner.temp }}/release.jks
          BLOOM_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BLOOM_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BLOOM_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BLOOM_UNSIGNED: ${{ steps.signing.outputs.enabled != 'true' && '1' || '' }}
        run: |
          if [ "$BLOOM_UNSIGNED" = "1" ]; then unset BLOOM_UPLOAD_STORE_FILE; fi
          ./gradlew assembleRelease --console=plain

      - name: Publish the release
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./app.json').expo.version")"
          BETA="$(node -p "require('./app.json').expo.extra.beta")"
          if [ "$BLOOM_VARIANT" = "beta" ]; then
            TAG="v${VERSION}-b${BETA}"; SHOWN="${VERSION}:b${BETA}"; PRE="--prerelease"
          else
            TAG="${GITHUB_REF_NAME}"
            if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="v${VERSION}"; fi
            SHOWN="${VERSION}"; PRE=""
          fi
          APK="BloomPlanner-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Bloom Planner ${SHOWN}" --generate-notes $PRE
          fi

      - name: Upload the unsigned APK
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BloomPlanner-unsigned-${{ env.BLOOM_VARIANT }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
          if-no-files-found: error
