name: Release Android APK

# Push a tag like v1.1.0 (matching "version" in app.json) to build a signed APK and publish it
# as a GitHub Release. Installed copies of the app see the new release and offer the download.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check the signing key is configured
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are not set, so this builds an UNSIGNED APK as a workflow artifact. Sign it locally with the release key (see README), or add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to publish releases automatically."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches app.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app.json version $APP_VERSION" >&2
            exit 1
          fi

      - name: Typecheck, lint and test
        run: |
          npx tsc --noEmit
          npx eslint src
          npx jest --ci

      - name: Restore the signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Generate the native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build the release APK
        working-directory: android
        env:
          NODE_ENV: production
          BLOOM_UPLOAD_STORE_FILE: ${{ runner.temp }}/release.jks
          BLOOM_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BLOOM_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BLOOM_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BLOOM_UNSIGNED: ${{ steps.signing.outputs.enabled != 'true' && '1' || '' }}
        run: |
          if [ "$BLOOM_UNSIGNED" = "1" ]; then unset BLOOM_UPLOAD_STORE_FILE; fi
          ./gradlew assembleRelease --console=plain

      - name: Publish the release
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="v$(node -p "require('./app.json').expo.version")"; fi
          APK="BloomPlanner-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Bloom Planner ${TAG}" --generate-notes
          fi

      - name: Upload the unsigned APK
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BloomPlanner-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
          if-no-files-found: error
