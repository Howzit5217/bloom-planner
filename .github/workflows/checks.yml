name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate the level table
        run: node -e "const d=require('./src/data/bloom-levels.json'); if(!Number.isInteger(d.version)||d.levels.length<d.maxLevel) throw new Error('bloom-levels.json: bump version and keep every level'); console.log('levels v'+d.version+':', d.levels.length)"
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx jest --ci
